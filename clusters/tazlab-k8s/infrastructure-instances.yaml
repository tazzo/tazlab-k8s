apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-instances
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
    - name: infrastructure-operators-data
  retryInterval: 2m
  interval: 1h
  path: ./infrastructure/cluster-instances
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
        optional: false
      - kind: Secret
        name: grafana-bootstrap-secret
        optional: false
  prune: true
  wait: true
  healthChecks:
    - apiVersion: postgres-operator.crunchydata.com/v1beta1
      kind: PostgresCluster
      name: tazlab-db
      namespace: tazlab-db
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
