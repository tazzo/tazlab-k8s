apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-bridge
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-operators
  interval: 1h
  path: ./infrastructure/cluster-bridge
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
