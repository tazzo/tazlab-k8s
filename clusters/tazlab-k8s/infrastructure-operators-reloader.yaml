apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-operators-reloader
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/operators/reloader
  prune: true
  wait: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
