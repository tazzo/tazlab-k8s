apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-halloween
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-operators-core
    - name: infrastructure-configs
  interval: 15m
  path: ./apps/cluster/halloween
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
