apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-tls
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
  interval: 1h
  path: ./infrastructure/tls
  prune: true
  wait: false
  retryInterval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m
