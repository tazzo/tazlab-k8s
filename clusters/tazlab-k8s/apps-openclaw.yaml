apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-openclaw
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/instances/openclaw
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure-configs
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
