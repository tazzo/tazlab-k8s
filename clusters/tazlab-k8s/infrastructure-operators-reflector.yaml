apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-operators-reflector
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-tailscale-dns
  interval: 1h
  path: ./infrastructure/operators/reflector
  prune: true
  wait: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
