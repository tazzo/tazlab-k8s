apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-operators-namespaces
  interval: 1h
  path: ./infrastructure/operators/monitoring
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
        optional: false
  prune: true
  wait: true # Now safe because it's decoupled
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
