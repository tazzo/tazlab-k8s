apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
roleRef:
  kind: ClusterRole
  name: homepage
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    services: true
    traefik: true
  docker.yaml: ""
  proxmox.yaml: ""
  custom.js: ""
  settings.yaml: |
    title: "TazLab Dashboard"
    background: https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop
    greeting: "TazLab Dashboard"
    headerStyle: "default"
    iconStyle: "silhouette"
    defaultColor: "slate"
  services.yaml: |
    - Developer:
        - Blog:
            icon: hugo.png
            href: "http://192.168.1.240/"
            description: "Blog personale"
    - Management:
        - pgAdmin:
            icon: postgresql.png
            href: "http://192.168.1.240:8001/"
            description: "Database management"
        - Longhorn:
            icon: longhorn.png
            href: "http://192.168.1.240:8002/"
            description: "Storage management"
        - Traefik:
            icon: traefik.png
            href: "http://192.168.1.240:8003/dashboard/"
            description: "Ingress statistics"
    - Infrastructure:
        - Proxmox:
            icon: proxmox.png
            href: "https://192.168.1.200:8006/"
            description: "Virtualization management"
        - PostgreSQL:
            icon: postgresql.png
            description: "Main database"
            widget:
              type: kubernetes
              selector: "postgres-operator.crunchydata.com/cluster=tazlab-db"
              namespace: "tazlab-db"
  bookmarks.yaml: ""
  custom.css: ""
  widgets.yaml: ""
  logs: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "192.168.1.240:8000"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - mountPath: /app/config
              name: config
            - mountPath: /app/config/logs
              name: logs
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.240
    metallb.universe.tf/allow-shared-ip: "tazlab-internal-dashboard"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Homepage"
    gethomepage.dev/group: "Developer"
    gethomepage.dev/icon: "homepage.png"
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 3000
  selector:
    app: homepage
