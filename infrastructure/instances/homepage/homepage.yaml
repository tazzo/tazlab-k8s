apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
roleRef:
  kind: ClusterRole
  name: homepage
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: false
    services: false
    traefik: true
  docker.yaml: ""
  proxmox.yaml: ""
  custom.js: ""
  settings.yaml: |
    title: "TazLab Dashboard"
    background: https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop
    headerStyle: "boxed"
    showGreeting: false
    logo: "https://raw.githubusercontent.com/tazzo/tazlab-k8s/master/infrastructure/instances/homepage/homepage.png"
    iconStyle: "silhouette"
    defaultColor: "slate"
  services.yaml: |
    - Developer:
        - Blog:
            icon: hugo.png
            href: "https://blog.tazlab.net"
            description: "Blog personale"
        - Homepage:
            icon: homepage.png
            href: "https://home.tazlab.net"
            description: "Questo pannello"
    - Monitoring:
        - Grafana:
            icon: grafana.png
            href: "https://grafana.tazlab.net"
            description: "Metrics & Dashboards"
        - Traefik:
            icon: traefik.png
            href: "https://traefik.tazlab.net/dashboard/"
            description: "Ingress statistics"
    - Management:
        - pgAdmin:
            icon: postgresql.png
            href: "https://pgadmin.tazlab.net"
            description: "Database management"
        - Longhorn:
            icon: longhorn.png
            href: "https://longhorn.tazlab.net"
            description: "Storage management"
    - Infrastructure:
        - Proxmox:
            icon: proxmox.png
            href: "https://192.168.1.200:8006/"
            description: "Virtualization management"
        - PostgreSQL:
            icon: postgresql.png
            description: "Main database"
            widget:
              type: kubernetes
              namespace: "tazlab-db"
              labelSelector: "postgres-operator.crunchydata.com/role=master"
  bookmarks.yaml: ""
  custom.css: |
    .greeting {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
      background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
  widgets.yaml: |
    - greeting:
        text: "TAZLAB"
        help: true
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
  logs: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "192.168.1.240:8000,home.tazlab.net"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - mountPath: /app/config
              name: config
            - mountPath: /app/config/logs
              name: logs
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.240
    metallb.universe.tf/allow-shared-ip: "tazlab-internal-dashboard"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Homepage"
    gethomepage.dev/group: "Developer"
    gethomepage.dev/icon: "homepage.png"
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 3000
  selector:
    app: homepage
