apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-sa
  namespace: ai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-view-binding
subjects:
  - kind: ServiceAccount
    name: openclaw-sa
    namespace: ai-agents
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
