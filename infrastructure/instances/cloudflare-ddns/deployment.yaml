apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  # 1 where the cluster sits behind a dynamic WAN address (Proxmox at home), 0 where the
  # platform has static addresses and the ingress is a cloud LB (Hetzner): there DDNS would
  # overwrite the apex A record with a node IP and take the sites down. Set by cluster-vars.
  replicas: ${ddns_replicas:=1}
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1.17.0
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
            - name: DOMAINS
              value: "tazlab.net"
            - name: PROXIED
              value: "false"
            - name: IP4_PROVIDER
              value: "cloudflare.trace"
            - name: IP6_PROVIDER
              value: "none"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
