apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-pvc
  namespace: tazlab-db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: tazlab-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: tazlab-db
  annotations:
    secret.reloader.stakater.com/reload: "tazlab-db-pguser-pgadmin"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
        app.kubernetes.io/name: pgadmin
    spec:
      serviceAccountName: pgadmin-sa
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.12
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tazlab-db-pguser-pgadmin
                  key: host
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@pgadmin.tazlab.net"
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tazlab-db-pguser-pgadmin
                  key: password
            - name: PGADMIN_CONFIG_SERVER_MODE
              value: "True"
            - name: PGADMIN_CONFIG_REVERSE_PROXY_ADDRESSES
              value: "['*']"
            - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
              value: "False"
          ports:
            - containerPort: 80
              name: http
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pgadmin-storage
              mountPath: /var/lib/pgadmin
      volumes:
        - name: pgadmin-storage
          persistentVolumeClaim:
            claimName: pgadmin-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: tazlab-db
  spec:
  type: ClusterIP
  selector:
    app: pgadmin
  ports:
    - port: 8001
      targetPort: 80
