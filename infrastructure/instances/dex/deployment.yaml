apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
        app.kubernetes.io/name: dex
    spec:
      serviceAccountName: dex-sa
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args:
            - dex
            - serve
            - /etc/dex/cfg/config.yaml
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-dex-secret
                  key: OAUTH2_PROXY_CLIENT_SECRET
          envFrom:
            - secretRef:
                name: dex-google-oauth
          ports:
            - name: http
              containerPort: 5556
            - name: grpc
              containerPort: 5558
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5556
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5556
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/dex/cfg
      volumes:
        - name: config
          configMap:
            name: dex-config
            items:
              - key: config.yaml
                path: config.yaml
