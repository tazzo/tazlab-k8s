apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: db-client-tazlab-admin-tls
  namespace: tazlab-db
spec:
  vaultAuthRef: vso-system/vso-pki-db-tazlab-admin
  mount: pki_int
  role: db-client-tazlab-admin
  commonName: tazlab-admin
  ttl: "24h"
  expiryOffset: "4h"
  destination:
    create: true
    name: db-client-tazlab-admin-tls
    type: kubernetes.io/tls
    overwrite: true

    transformation:
      excludeRaw: true
      templates:
        ca.crt:
          text: |
            {{- range $_, $c := .Secrets.ca_chain }}{{ $c }}
            {{ end -}}