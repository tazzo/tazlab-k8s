apiVersion: batch/v1
kind: Job
metadata:
  name: paperclip-drop
  namespace: tazlab-db
  labels:
    app: paperclip-drop
    app.kubernetes.io/name: paperclip-drop
spec:
  # Same GitOps-stable shape as multica-db-grants-job: without manualSelector the
  # apiserver injects controller-uid/job-name labels into spec.template on
  # creation, and the next SSA apply sees an immutable diff and freezes the whole
  # instances Kustomization. manualSelector keeps desired == live.
  manualSelector: true
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip-drop
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: paperclip-drop
        app.kubernetes.io/name: paperclip-drop
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          # Same digest-pinned image as multica-db-grants-job.yaml.
          image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          env:
            - name: PGHOST
              value: tazlab-db-primary.tazlab-db.svc
            - name: PGPORT
              value: "5432"
            # Must be a database other than `paperclip`: PostgreSQL refuses to drop
            # the database the session is connected to.
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: tazlab-db-pguser-postgres
                  key: user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tazlab-db-pguser-postgres
                  key: password
          command: ["sh", "-c", "-e"]
          args:
            - |
              # PGO does not delete users or databases when they leave spec.users
              # (documented behaviour), so this one-shot Job performs the drop. It
              # is idempotent: the DO block only drops owned objects if the role
              # still exists, and DROP DATABASE/ROLE use IF EXISTS.
              i=0
              until psql -t -c "SELECT 1" >/dev/null 2>&1; do
                i=$((i+1))
                [ "$i" -gt 120 ] && echo "FATAL: database not reachable in 10m" && exit 1
                echo "waiting for database ($i)..."
                sleep 5
              done
              psql -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS paperclip WITH (FORCE);"
              psql -v ON_ERROR_STOP=1 -c "DO \$\$BEGIN IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'paperclip') THEN EXECUTE 'DROP OWNED BY paperclip'; END IF; END\$\$;"
              psql -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS paperclip;"
              psql -v ON_ERROR_STOP=1 -t -c "SELECT 'db='||count(*) FROM pg_database WHERE datname='paperclip'; SELECT 'role='||count(*) FROM pg_roles WHERE rolname='paperclip';"
