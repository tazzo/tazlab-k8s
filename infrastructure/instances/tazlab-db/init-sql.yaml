apiVersion: v1
kind: ConfigMap
metadata:
  name: tazlab-db-init-sql
  namespace: tazlab-db
data:
  init.sql: |
    -- Bootstrap: ensure tazlab-admin can create roles and manage grafana membership
    ALTER ROLE "tazlab-admin" CREATEROLE;
    GRANT grafana TO "tazlab-admin" WITH ADMIN OPTION;
    -- Setup Mnemosyne Memory DB
    \c mnemosyne
    GRANT ALL ON SCHEMA public TO mnemosyne;
    ALTER SCHEMA public OWNER TO mnemosyne;
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE TABLE IF NOT EXISTS memories (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        timestamp TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        content TEXT NOT NULL,
        embedding VECTOR(3072)
    );
    CREATE TABLE IF NOT EXISTS archived_files (
        id SERIAL PRIMARY KEY,
        filename TEXT UNIQUE NOT NULL,
        archived_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
    );
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO mnemosyne;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO mnemosyne;

    -- Setup Main Tazlab DB
    \c tazlab
    GRANT ALL ON SCHEMA public TO "tazlab-admin";
    ALTER SCHEMA public OWNER TO "tazlab-admin";
    CREATE TABLE IF NOT EXISTS memories (
        id SERIAL PRIMARY KEY,
        content TEXT NOT NULL,
        metadata JSONB,
        tags JSONB,
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
    );

    -- Setup Dummy Test DB for Rebirth Validation
    \c tazlab-test
    GRANT ALL ON SCHEMA public TO "tazlab-admin";
    ALTER SCHEMA public OWNER TO "tazlab-admin";
    CREATE TABLE IF NOT EXISTS rebirth_test (
        id SERIAL PRIMARY KEY,
        test_val TEXT NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO rebirth_test (test_val) VALUES ('Data Immortality Test - ' || NOW());

    -- Setup Grafana Persistence DB
    \c grafana
    GRANT ALL ON SCHEMA public TO grafana;
    ALTER SCHEMA public OWNER TO grafana;

    -- Setup Hindsight Memory DB (Alembic-managed schema, extension for pgvector)
    \c hindsight
    GRANT ALL ON SCHEMA public TO hindsight;
    ALTER SCHEMA public OWNER TO hindsight;
    CREATE EXTENSION IF NOT EXISTS vector;
