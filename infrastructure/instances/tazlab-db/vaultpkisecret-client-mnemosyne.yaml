apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: db-client-mnemosyne-tls
  namespace: tazlab-db
spec:
  vaultAuthRef: vso-system/vso-pki-db-mnemosyne
  mount: pki_int
  role: db-client-mnemosyne
  commonName: mnemosyne
  ttl: "24h"
  expiryOffset: "4h"
  destination:
    create: true
    name: db-client-mnemosyne-tls
    type: kubernetes.io/tls
    overwrite: true
