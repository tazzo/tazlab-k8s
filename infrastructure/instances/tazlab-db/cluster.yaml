apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: tazlab-db
  namespace: tazlab-db
spec:
  postgresVersion: 16
  dataSource:
    pgbackrest:
      stanza: db
      configuration:
        - secret:
            name: s3-backrest-creds
      repo:
        name: repo1
        s3:
          bucket: "tazlab-storage"
          endpoint: "s3.amazonaws.com"
          region: "eu-central-1"
      options:
        - --delta
  databaseInitSQL:
    name: tazlab-db-init-sql
    key: init.sql
  instances:
    - name: instance1
      replicas: 1
      metadata:
        labels:
          app.kubernetes.io/name: tazlab-db
      dataVolumeClaimSpec:
        storageClassName: tazlab-storage
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  backups:
    pgbackrest:
      global:
        repo1-path: /pgbackrest/repo1
        repo1-type: s3
      configuration:
        - secret:
            name: s3-backrest-creds
      repos:
      - name: repo1
        schedules:
          full: "0 1 * * 0"
          differential: "0 1 * * 1-6"
        s3:
          bucket: "tazlab-storage"
          endpoint: "s3.amazonaws.com"
          region: "eu-central-1"
  proxy:
    pgBouncer:
      replicas: 1
  users:
    - name: pgadmin
      databases:
        - postgres
    - name: mnemosyne
      databases:
        - mnemosyne
    - name: tazlab-admin
      databases:
        - tazlab
        - tazlab-test
    - name: grafana
      databases:
        - grafana
  patroni:
    dynamicConfiguration:
      postgresql:
        pg_hba:
          # Allow grafana user from anywhere before rejection rules
          # Use scram-sha-256 to match password hashing method in database
          # Support both SSL/TLS (hostssl) and plain connections (host)
          - hostssl grafana grafana 0.0.0.0/0 scram-sha-256
          - hostssl grafana grafana ::/0 scram-sha-256
          - hostssl all grafana 0.0.0.0/0 scram-sha-256
          - hostssl all grafana ::/0 scram-sha-256
          - host grafana grafana 0.0.0.0/0 scram-sha-256
          - host grafana grafana ::/0 scram-sha-256
          - host all grafana 0.0.0.0/0 scram-sha-256
          - host all grafana ::/0 scram-sha-256
          # Other users
          - host mnemosyne mnemosyne 0.0.0.0/0 md5
          - host mnemosyne mnemosyne ::/0 md5
          - host mnemosyne all 0.0.0.0/0 md5
          - host mnemosyne all ::/0 md5
          - host tazlab-admin all 0.0.0.0/0 md5
          - host tazlab-admin all ::/0 md5
          # Network ranges
          - host all all 10.0.0.0/8 md5
          - host all all 10.244.0.0/16 md5
