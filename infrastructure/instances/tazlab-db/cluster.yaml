apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: tazlab-db
  namespace: tazlab-db
spec:
  postgresVersion: 16
  dataSource:
    pgbackrest:
      stanza: db
      repo:
        name: repo1
      options:
        - --type=immediate
        - --delta
  databaseInitSQL:
    name: tazlab-db-init-sql
    key: init.sql
  instances:
    - name: instance1
      replicas: 1
      dataVolumeClaimSpec:
        storageClassName: tazlab-storage
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  backups:
    pgbackrest:
      configuration:
        - secret:
            name: s3-backrest-creds
      repos:
      - name: repo1
        # No 's3:' block here to avoid operator interference
  proxy:
    pgBouncer:
      replicas: 1
  users:
    - name: mnemosyne
      databases:
        - mnemosyne
    - name: tazlab-admin
      databases:
        - tazlab
        - tazlab-test