apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: tazlab-db
  namespace: tazlab-db
  annotations:
    # Innesca il backup one-off richiesto dal passo 1 del major upgrade (PGO lo
    # rileva e crea il Job). Il valore cambia a ogni backup: e' il contatore.
    postgres-operator.crunchydata.com/pgbackrest-backup: "post-upgrade-pg17-20260927-1014"
spec:
  postgresVersion: 17
  # Spento per il major upgrade: PGO scala a zero database e pooler. Torna false nel commit
  # che imposta postgresVersion: 17, dopo la rimozione dell'oggetto PGUpgrade.
  shutdown: false
  databaseInitSQL:
    name: tazlab-db-init-sql
    key: init.sql
  instances:
    - name: instance1
      replicas: 1
      metadata:
        labels:
          app.kubernetes.io/name: tazlab-db
      dataVolumeClaimSpec:
        storageClassName: tazlab-storage
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
  backups:
    pgbackrest:
      # Backup manuale one-off, di tipo full: e' la base di ripristino che serve
      # prima del major upgrade (un differenziale non basterebbe).
      manual:
        repoName: repo1
        options:
          - --type=full
      global:
        repo1-path: /pgbackrest/repo1
        repo1-type: s3
      configuration:
        - secret:
            name: s3-backrest-creds
      repos:
      - name: repo1
        schedules:
          full: "0 1 * * 0"
          differential: "0 1 * * 1-6"
        s3:
          bucket: "tazlab-storage"
          endpoint: "s3.amazonaws.com"
          region: "eu-central-1"
  proxy:
    pgBouncer:
      replicas: 1
  users:
    - name: pgadmin
      databases:
        - postgres
    - name: mnemosyne
      databases:
        - mnemosyne
    - name: tazlab-admin
      databases:
        - tazlab
        - tazlab-test
    - name: grafana
      databases:
        - grafana
    - name: hindsight
      databases:
        - hindsight
    - name: postgres
      databases:
        - postgres
    - name: paperclip
      databases:
        - paperclip
    - name: multica
      databases:
        - multica
    - name: buzz
      databases:
        - buzz
  customTLSSecret:
    name: tazlab-db-server-tls
    items:
      - key: ca.crt
        path: ca.crt
      - key: tls.crt
        path: tls.crt
      - key: tls.key
        path: tls.key
  customReplicationTLSSecret:
    name: tazlab-db-server-tls
    items:
      - key: ca.crt
        path: ca.crt
      - key: tls.crt
        path: tls.crt
      - key: tls.key
        path: tls.key
  patroni:
    dynamicConfiguration:
      postgresql:
        pg_hba:
          - hostssl grafana grafana 0.0.0.0/0 cert
          - hostssl grafana grafana ::/0 cert
          - hostssl grafana grafana 0.0.0.0/0 md5
          - hostssl grafana grafana ::/0 md5
          - hostssl all grafana 0.0.0.0/0 md5
          - hostssl all grafana ::/0 md5
          - host grafana grafana 0.0.0.0/0 md5
          - host grafana grafana ::/0 md5
          - host all grafana 0.0.0.0/0 md5
          - host all grafana ::/0 md5
          - hostssl mnemosyne mnemosyne 0.0.0.0/0 cert
          - hostssl mnemosyne mnemosyne ::/0 cert
          - hostssl hindsight hindsight 0.0.0.0/0 cert
          - hostssl hindsight hindsight ::/0 cert
          - host tazlab-admin all 0.0.0.0/0 md5
          - host tazlab-admin all ::/0 md5
          - hostssl postgres pgadmin 0.0.0.0/0 cert
          - hostssl postgres pgadmin ::/0 cert
          - host postgres pgadmin 0.0.0.0/0 reject
          - host postgres pgadmin ::/0 reject
          # paperclip (project paperclip-lxc-deployment): TLS + password, and only
          # its own database. pg_hba field order is (DATABASE, USER, ADDRESS), so
          # the reject rows read `all paperclip` — database=all, user=paperclip —
          # which is what closes the generic 10/8 rows below for this user on every
          # other database and on non-TLS connections.
          - hostssl paperclip paperclip 0.0.0.0/0 md5
          - hostssl paperclip paperclip ::/0 md5
          - host all paperclip 0.0.0.0/0 reject
          - host all paperclip ::/0 reject
          # multica (project multica-agent-orchestration): certificate auth only,
          # and only its own database. The two reject rows are what make that
          # true: pg_hba is first-match-wins, so without them the `multica` role
          # would still fall through to the generic `host all all 10.0.0.0/8 md5`
          # / `10.244.0.0/16 md5` rows below and authenticate with a password.
          # They are placed here, above those generic rows, and after the cert
          # rows, which stay the only accepted way in.
          - hostssl multica multica 0.0.0.0/0 cert
          - hostssl multica multica ::/0 cert
          - host all multica 0.0.0.0/0 reject
          - host all multica ::/0 reject
          # buzz (project buzz-agent-orchestration): certificate auth only, and only
          # its own database. Same shape as the multica rows above, for the same
          # reason: pg_hba is first-match-wins, so without the two `reject` rows the
          # `buzz` role would fall through to the generic `host all all 10.0.0.0/8
          # md5` rows below and authenticate with a password. Placement matters
          # twice: above the generic rows, and after the `cert` rows, which stay
          # the only accepted way in.
          - hostssl buzz buzz 0.0.0.0/0 cert
          - hostssl buzz buzz ::/0 cert
          - host all buzz 0.0.0.0/0 reject
          - host all buzz ::/0 reject
          - host all all 10.0.0.0/8 md5
          - host all all 10.244.0.0/16 md5
