apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: auth
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      initContainers:
        - name: wait-for-dex
          image: curlimages/curl:8.7.1
          args:
            - -k
            - -s
            - -o
            - /dev/null
            - -w
            - "%{http_code}"
            - --retry
            - "30"
            - --retry-delay
            - "5"
            - --retry-all-errors
            - https://dex.tazlab.net/.well-known/openid-configuration
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://dex.tazlab.net
            - --client-id=oauth2-proxy
            - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
            - --cookie-secure=true
            - --cookie-domain=.tazlab.net
            - --whitelist-domain=.tazlab.net
            - --redirect-url=https://auth.tazlab.net/oauth2/callback
            - --upstream=static://200
            - --http-address=:4180
            - --skip-provider-button=true
            - --set-xauthrequest=true
            - --reverse-proxy=true
            - --authenticated-emails-file=/etc/oauth2-proxy/allowed-emails.txt
            - --silence-ping-logging=true
            - --provider-ca-file=/etc/oauth2-proxy/ca.crt
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - name: http
              containerPort: 4180
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: allowed-emails
              mountPath: /etc/oauth2-proxy
            - name: pki-ca
              mountPath: /etc/oauth2-proxy/ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: allowed-emails
          configMap:
            name: oauth2-proxy-emails
        - name: pki-ca
          secret:
            secretName: vault-pki-tls
            optional: true
