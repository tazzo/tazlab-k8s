apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tazlab-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tazlab-admin-binding
subjects:
  - kind: User
    name: ${ADMIN_EMAIL}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: tazlab-admin
  apiGroup: rbac.authorization.k8s.io
