apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: mnemosyne
  namespace: mnemosyne-db
spec:
  # Rimuovendo 'image' lasciamo che l'operatore scelga l'immagine corretta
  # Se pgvector è necessario, di solito l'operatore Crunchy ha immagini che lo includono
  # o dobbiamo usare un'annotazione/configurazione specifica.
  # Ma per ora puntiamo a far partire il cluster.
  postgresVersion: 16
  instances:
    - name: instance1
      replicas: 1
      dataVolumeClaimSpec:
        storageClassName: longhorn-postgres
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  backups:
    pgbackrest:
      # Rimuoviamo l'immagine esplicita
      repos:
      - name: repo1
        volume:
          volumeClaimSpec:
            storageClassName: longhorn-postgres
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
  proxy:
    pgBouncer:
      # Rimuoviamo l'immagine esplicita
      replicas: 1
  users:
    - name: mnemosyne
      databases:
        - tazlab_memory