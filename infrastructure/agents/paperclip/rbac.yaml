# Read-only cluster identity for the Paperclip container (design task T4.2).
#
# Why it is not Flux's identity: Flux reconciles this cluster as cluster-admin —
# ClusterRoleBinding cluster-reconciler-flux-system binds the kustomize-controller and
# helm-controller ServiceAccounts to cluster-admin
# (clusters/tazlab-k8s/flux-system/gotk-components.yaml). An autonomous process holding
# that identity can rewrite anything the cluster manages. The agent only looks; every
# change stays a pull request -> Flux.
#
# What this identity CANNOT do. These properties are what make it safe to run unattended;
# all of them were re-verified against this cluster (K8s v1.35.0, effective rule set of
# `view` = the union of every ClusterRole labelled
# rbac.authorization.k8s.io/aggregate-to-view, 255 rules, verbs get/list/watch only):
#
#   * No Secrets. Nothing in the set grants any resource named `secrets` in any API group
#     — a deliberate exclusion in Kubernetes, "to avoid exposing ServiceAccount
#     credentials" (kubernetes.io/docs/reference/access-authn-authz/rbac). Recorded here
#     as a feature, not a gap: the agent cannot harvest a credential that would let it
#     skip the pull-request path, and it cannot read the token Secret it authenticates with.
#   * No verb other than get/list/watch.
#   * No pods/exec, pods/attach, pods/portforward, pods/proxy — those are `edit` verbs.
#     There is no interactive path into a running workload, so no way to borrow the
#     identity of a pod that has a wider one.
#   * No read on Roles/RoleBindings (also `view`-excluded): the RBAC graph cannot be
#     enumerated from here, let alone edited.
#
# Namespace: flux-system. This identity runs no pod, so it needs no namespace of its own;
# the lab already keeps its only other cluster-observation identity there
# (flux-dag-watchdog, infrastructure/watchdog/rbac.yaml), and this project's research did
# the same (web-research/P2). The namespace is only the prefix of the RBAC principal:
# system:serviceaccount:flux-system:paperclip-observer
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperclip-observer
  namespace: flux-system
# Deliberately no `.secrets` reference to the token Secret, although the obvious shape of
# this pattern ("the Secret is referenced by the ServiceAccount") has one: the API server
# *classifies a legacy token as auto-generated when the ServiceAccount references it*
# (pkg/serviceaccount/legacy.go loops over serviceAccount.Secrets, sets autoGenerated and
# attaches a warning to every authenticated request). Declaring it would make every agent
# call print "Use tokens from the TokenRequest API ... instead of auto-generated
# secret-based tokens" and make the credential eligible for the legacy-token clean-up.
# The token is still this ServiceAccount's: the reference runs the other direction, from
# the Secret's kubernetes.io/service-account.name annotation (token.yaml), which is the
# direction the documentation prescribes for a manually created token. The token
# controller never adds that reference itself — it only removes one when the Secret it
# points at is deleted (pkg/controller/serviceaccount/tokens_controller.go) — so declaring
# it here would be inert except for those two side effects.
---
# `view` ∪ `flux-view-flux-system`, written out rule by rule.
#
# Why not bind the two existing roles separately: this is a security control, so the grant
# has to be legible in review and widening it has to be a reviewed commit. In this cluster
# `view` owns no rules of its own — the control plane composes it from every ClusterRole
# labelled rbac.authorization.k8s.io/aggregate-to-view — and `flux-view-flux-system`
# carries that label. The rules below are that set, transcribed from the live objects, with
# the Flux rule written out explicitly so the agent's Flux read access does not silently
# depend on a label owned by the Flux release.
#
# Drift is intentional in both directions: widening `view` upstream, or installing a new
# operator that aggregates a read role into it, does NOT widen this role. Re-diff before
# extending:
#   kubectl get clusterrole view -o json | jq '.rules'
#   kubectl get clusterrole flux-view-flux-system -o json | jq '.rules'
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: paperclip-observer
rules:
  # --- `view`: the cluster's own resources. Source: ClusterRole
  # `system:aggregate-to-view` (K8s v1.35.0); split over more rule entries than upstream
  # only to keep the lines readable — RBAC rules are a set union.
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "persistentvolumeclaims", "persistentvolumeclaims/status", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["replicationcontrollers", "replicationcontrollers/scale", "serviceaccounts", "services", "services/status"]
    verbs: ["get", "list", "watch"]
  # Reading namespaces is what makes `kubectl get ns` and `-A` traversal work.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # pods/log is the useful half of the pod surface; pods/exec is absent by design (see the
  # header). RBAC cannot express "logs but not exec" in one rule — it needs the subresource
  # named explicitly, which is why both appear as separate resources in Kubernetes' own
  # role rather than as a wildcard.
  - apiGroups: [""]
    resources: ["bindings", "limitranges", "namespaces/status", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["replicationcontrollers/status", "resourcequotas", "resourcequotas/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["controllerrevisions", "daemonsets", "daemonsets/status", "deployments", "deployments/scale"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status", "replicasets", "replicasets/scale", "replicasets/status", "statefulsets", "statefulsets/scale", "statefulsets/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers", "horizontalpodautoscalers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "cronjobs/status", "jobs", "jobs/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["daemonsets", "daemonsets/status", "deployments", "deployments/scale", "deployments/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["ingresses", "ingresses/status", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["replicasets", "replicasets/scale", "replicasets/status", "replicationcontrollers/scale"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingresses/status", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets", "poddisruptionbudgets/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceclaims/status", "resourceclaimtemplates"]
    verbs: ["get", "list", "watch"]
  # Note: the `nodes` object is NOT in this cluster's `view` (verified on v1.35.0 — the
  # only `nodes` in the set is metrics.k8s.io). So `kubectl get nodes` is forbidden to the
  # agent, by design of the role it was given. Node-level visibility comes from the Talos
  # `os:reader` client certificate and the Proxmox auditor ACL instead. If kubectl-level
  # node read is wanted later, it has to be added here as a reviewed change.
  #
  # --- `flux-view-flux-system`. Source: Flux v2.7.5 gotk-components.yaml (one rule
  # upstream; split across two apiGroups lines for line length only). This is what lets
  # the agent answer "is the cluster converged, and if not why" — Kustomizations,
  # HelmReleases, GitRepositories, ImagePolicies, notifications.
  - apiGroups: ["helm.toolkit.fluxcd.io", "image.toolkit.fluxcd.io", "kustomize.toolkit.fluxcd.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["notification.toolkit.fluxcd.io", "source.extensions.fluxcd.io", "source.toolkit.fluxcd.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # --- the operator-provided read roles that `view` also aggregates in this cluster
  # (sources: ClusterRoles cert-manager-view, external-secrets-view,
  # system:metrics-server-aggregated-reader), kept so the agent can diagnose a workload
  # whose Certificate or ExternalSecret is not ready, and read node/pod metrics. Inert if
  # the operator is removed: the API group disappears with it.
  - apiGroups: ["acme.cert-manager.io"]
    resources: ["challenges", "orders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores", "clustersecretstores", "pushsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["generators.external-secrets.io"]
    resources: ["acraccesstokens", "ecrauthorizationtokens", "fakes", "gcraccesstokens", "githubaccesstokens", "passwords", "vaultdynamicsecrets", "webhooks"]
    verbs: ["get", "list", "watch"]
  # metrics.k8s.io, not the `nodes` object — see the note above.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paperclip-observer
subjects:
  - kind: ServiceAccount
    name: paperclip-observer
    namespace: flux-system
roleRef:
  kind: ClusterRole
  name: paperclip-observer
  apiGroup: rbac.authorization.k8s.io
