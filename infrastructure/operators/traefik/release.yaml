apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: "34.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  interval: 1h
  install:
    remediation:
      retries: 3
  values:
    deployment:
      kind: Deployment
      replicas: 2
    podSecurityContext:
      fsGroup: 65532
    additionalArguments:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:8000"
      - "--entrypoints.websecure.address=:8443"
    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
    service:
      enabled: true
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.1.240
        metallb.universe.tf/allow-shared-ip: "tazlab-internal-dashboard"
    persistence:
      enabled: false
