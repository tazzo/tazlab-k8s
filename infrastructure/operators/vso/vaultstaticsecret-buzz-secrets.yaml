apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: buzz-secrets-sync
  namespace: buzz
spec:
  vaultAuthRef: vso-system/vso-jwt-auth
  mount: secret
  type: kv-v2
  path: tazlab-k8s/static/apps/buzz/merged
  refreshAfter: 3600s
  hmacSecretData: true
  destination:
    create: true
    name: buzz-secrets
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
      - .*
      # Exactly five keys, and the list is exhaustive on purpose.
      #
      # NO S3 KEYS AT ALL, not even empty: with BUZZ_S3_ACCESS_KEY /
      # BUZZ_S3_SECRET_KEY present but empty the AWS client walks the whole
      # credential chain (env → profile → container → IMDS) and the process exits
      # with NoCredentials after tens of seconds. Omitted entirely, the binary's
      # static defaults apply and no S3 endpoint is ever contacted
      # (NO-S3 §3.2). The relay starts with
      # BUZZ_GIT_CONFORMANCE_PROBE=false (HelmRelease, relay.extraEnv).
      #
      # REDIS_PASSWORD is not read by the chart's Deployment — the Redis pod reads
      # it (apps/base/buzz/redis.yaml). REDIS_URL embeds the same password, so the
      # two fields must be updated together, in one act of the operator.
      templates:
        BUZZ_RELAY_PRIVATE_KEY:
          text: '{{ get .Secrets "BUZZ_RELAY_PRIVATE_KEY" }}'
        BUZZ_GIT_HOOK_HMAC_SECRET:
          text: '{{ get .Secrets "BUZZ_GIT_HOOK_HMAC_SECRET" }}'
        DATABASE_URL:
          text: '{{ get .Secrets "DATABASE_URL" }}'
        REDIS_URL:
          text: '{{ get .Secrets "REDIS_URL" }}'
        REDIS_PASSWORD:
          text: '{{ get .Secrets "REDIS_PASSWORD" }}'
  rolloutRestartTargets:
  # The chart's fullname is `buzz` (release name `buzz` contains the chart name
  # `buzz`), so the Deployment is `buzz`, not `buzz-buzz`. A wrong name is not an
  # error at apply time: VSO logs "Rollout restart failed ... not found" on every
  # sync and the pod keeps the environment of the Secret it started with (envFrom
  # is read at start), so a rotated relay key would never reach the process.
  - kind: Deployment
    name: buzz
