apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-pki-db-multica
  namespace: vso-system
spec:
  allowedNamespaces:
  - multica
  jwt:
    audiences:
    - https://kubernetes.default.svc.cluster.local
    role: vso-role-db-multica
    serviceAccount: vso-auth-sa
    tokenExpirationSeconds: 600
  method: jwt
  mount: jwt
  vaultConnectionRef: hetzner-vault-connection
