apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: db-client-buzz-tls
  namespace: buzz
spec:
  vaultAuthRef: vso-system/vso-pki-db-buzz
  mount: pki_int
  role: db-client-buzz
  # CN must equal the database role: that is what pg_hba's `hostssl buzz buzz ...
  # cert` matches on. No pg_ident mapping is involved (same as multica/mnemosyne).
  commonName: buzz
  ttl: "24h"
  expiryOffset: "4h"
  destination:
    create: true
    name: db-client-buzz-tls
    type: kubernetes.io/tls
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        tls.crt:
          text: |
            {{ .Secrets.certificate }}
        tls.key:
          text: |
            {{ .Secrets.private_key }}
        ca.crt:
          # MANDATORY: ca_chain alone does NOT contain the offline root. The
          # intermediate authority lives in Vault; the offline root
          # (TazLab Offline Root Authority, valid to 2046) exists only in this
          # block. With sslmode=verify-full and a PGSSLROOTCERT missing the root,
          # the handshake never completes, the pod stays in CrashLoopBackOff, and
          # the most likely diagnosis ("Postgres rejects the certificate") is
          # wrong.
          text: |
            {{- range $_, $c := .Secrets.ca_chain }}{{ $c }}
            {{ end }}
            -----BEGIN CERTIFICATE-----
            MIIB8jCCAXigAwIBAgIUD5fkLrrSp2swvwib+S9FeySo1OQwCgYIKoZIzj0EAwMw
            KDEmMCQGA1UEAwwdVGF6TGFiIE9mZmxpbmUgUm9vdCBBdXRob3JpdHkwHhcNMjYw
            NjI1MjI1MTM4WhcNNDYwNjIwMjI1MTM4WjAoMSYwJAYDVQQDDB1UYXpMYWIgT2Zm
            bGluZSBSb290IEF1dGhvcml0eTB2MBAGByqGSM49AgEGBSuBBAAiA2IABF581wHk
            2I9epBVSQJK5MjHmbBIOLmnZGQ2aKv0vyrjP2hi2b/MsEpCsnoat+PGO3RgxbEKY
            cNRsmwaPWZBTT3XxhFIaGsXL/YNCcE/UowxdYZLg0AX5UOARdkB7/7VrAaNjMGEw
            DwYDVR0TAQH/BAUwAwEB/zAOBgNVHQ8BAf8EBAMCAQYwHQYDVR0OBBYEFIgNdmR7
            Y9Jdps3TUrCNISQPreEGMB8GA1UdIwQYMBaAFIgNdmR7Y9Jdps3TUrCNISQPreEG
            MAoGCCqGSM49BAMDA2gAMGUCMQDIMVWXD5IHMRKRp6BuJX4Knrdd8IhYsBabjE3t
            hmrQChvCtl8nvWKJREzNGvzrQFACMHj0JEHvZXsNv7/ZtnOv6pJIjVFmh2aLrgRH
            L16szenOUeOaD2iYbfp1K1FIXeCbVw==
            -----END CERTIFICATE-----
  rolloutRestartTargets:
    # Same rule as the VaultStaticSecret above: the Deployment is `buzz`.
    - kind: Deployment
      name: buzz
