apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: teaching-opencode-key
  namespace: teaching
spec:
  vaultAuthRef: vso-system/vso-jwt-auth
  mount: secret
  type: kv-v2
  path: tazlab-k8s/static/apps/teaching/OPENCODE_API_KEY
  refreshAfter: 3600s
  destination:
    create: true
    name: teaching-opencode-key
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: teaching
