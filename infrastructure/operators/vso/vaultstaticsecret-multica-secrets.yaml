apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: multica-secrets-sync
  namespace: multica
spec:
  vaultAuthRef: vso-system/vso-jwt-auth
  mount: secret
  type: kv-v2
  path: tazlab-k8s/static/apps/multica/merged
  refreshAfter: 3600s
  hmacSecretData: true
  destination:
    create: true
    name: multica-secrets
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
      - .*
      templates:
        JWT_SECRET:
          text: '{{ get .Secrets "JWT_SECRET" }}'
        DATABASE_URL:
          text: '{{ get .Secrets "DATABASE_URL" }}'
        MULTICA_VCS_SECRET_KEY:
          text: '{{ get .Secrets "MULTICA_VCS_SECRET_KEY" }}'
        RESEND_API_KEY:
          text: '{{ get .Secrets "RESEND_API_KEY" }}'
        GOOGLE_CLIENT_SECRET:
          text: '{{ get .Secrets "GOOGLE_CLIENT_SECRET" }}'
        CLOUDFRONT_PRIVATE_KEY:
          text: '{{ get .Secrets "CLOUDFRONT_PRIVATE_KEY" }}'
        MULTICA_DEV_VERIFICATION_CODE:
          text: '{{ get .Secrets "MULTICA_DEV_VERIFICATION_CODE" }}'
  rolloutRestartTargets:
  - kind: Deployment
    name: multica-backend
