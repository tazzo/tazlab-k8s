apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: wildcard-tls-crt
  namespace: auth
spec:
  vaultAuthRef: vso-system/vso-jwt-auth
  mount: secret
  type: kv-v2
  path: tazlab-k8s/static/tls/wildcard/WILDCARD_CRT
  refreshAfter: 3600s
  destination:
    name: wildcard-tls
    create: true
    overwrite: false
    type: kubernetes.io/tls
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        tls.crt:
          text: '{{ get .Secrets "value" }}'
---
