apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - sa-vso-auth-sa.yaml
  - vaultconnection.yaml
  - vaultauth.yaml
  - helmrelease.yaml
  - sa-vso-auth-sa-tazlab-db.yaml
  - vaultstaticsecret-mnemosyne.yaml
  - vaultstaticsecret-oauth2-proxy.yaml
  - vaultstaticsecret-cloudflare-ddns.yaml
  - vaultstaticsecret-cert-manager.yaml
secretGenerator:
  - name: vault-ca-cert
    namespace: vso-system
    files:
      - ca.crt
    type: Opaque
generatorOptions:
  disableNameSuffixHash: true
