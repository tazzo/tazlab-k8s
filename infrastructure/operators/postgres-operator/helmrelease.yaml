apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-operator
  namespace: flux-system
spec:
  interval: 15m
  chart:
    spec:
      chart: pgo
      version: "5.7.2"
      sourceRef:
        kind: HelmRepository
        name: crunchydata-repo
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  targetNamespace: postgres-operator
  values:
    # Per ora usiamo i default per semplicità.
    # L'operatore Crunchy installerà i controller necessari.
    pgo:
      # Disabilitiamo l'installazione delle CRD se vogliamo gestirle noi, 
      # ma solitamente le lasciamo gestire all'operatore al primo avvio.
      installCRDs: true
