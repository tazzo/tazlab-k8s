apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-agent-injector
  namespace: vault-injector
spec:
  releaseName: vault-agent-injector
  chart:
    spec:
      chart: vault
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      enabled: true
      tlsDisable: false
      externalVaultAddr: "https://lushycorp-vault.magellanic-gondola.ts.net:8200"

    server:
      enabled: false

    injector:
      enabled: true
      replicas: 1
      logLevel: info
      authPath: "auth/jwt"
      revokeOnShutdown: true

      agentDefaults:
        cpuLimit: "500m"
        cpuRequest: "250m"
        memLimit: "128Mi"
        memRequest: "64Mi"
        template: "map"

      webhook:
        failurePolicy: Ignore
        timeoutSeconds: 30
