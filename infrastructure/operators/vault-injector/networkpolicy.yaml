apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook
  namespace: vault-injector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: injector
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - port: 9443
          protocol: TCP
