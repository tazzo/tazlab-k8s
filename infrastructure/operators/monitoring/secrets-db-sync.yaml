apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tazlab-db-pguser-grafana
  namespace: tazlab-db # Enterprise: Pre-popoliamo il segreto per l'operatore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tazlab-secrets
    kind: ClusterSecretStore
  target:
    name: tazlab-db-pguser-grafana
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: tazlab-db
          postgres-operator.crunchydata.com/pguser: grafana
          postgres-operator.crunchydata.com/role: pguser
      data:
        user: "{{ .user }}"
        password: "{{ .password }}"
        dbname: "grafana"
  data:
    - secretKey: password
      remoteRef:
        key: GRAFANA_DB_PASSWORD
    - secretKey: user
      remoteRef:
        key: GRAFANA_DB_USER
