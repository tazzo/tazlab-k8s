apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  releaseName: kube-prometheus-stack
  interval: 1h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "61.3.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    # Minimal Setup to avoid timeouts
    alertmanager:
      enabled: false
    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true
    
    # Prometheus Configuration
    prometheus:
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: tazlab-storage
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    
    # Grafana Configuration (SQLite Local Database)
    grafana:
      enabled: true
      grafana.ini:
        database:
          type: sqlite3
          path: /var/lib/grafana/grafana.db
        auth.proxy:
          enabled: true
          header_name: X-Auth-Request-User
          header_property: username
          header_email: X-Auth-Request-Email
          auto_sign_up: true
          sync_ttl: 0
          sync_ttl_api_key: 0
          enable_login_token_rotation: false
          skip_org_role_sync: true
        security:
          admin_user: ''
          allow_login_without_configured_admin: true
      # No external database needed - using local SQLite
      
      persistence:
        enabled: false
      service:
        type: LoadBalancer
        annotations:
          metallb.universe.tf/loadBalancerIPs: "192.168.1.240"
          metallb.universe.tf/allow-shared-ip: "tazlab-internal-dashboard"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Grafana"
          gethomepage.dev/group: "Management"
          gethomepage.dev/icon: "grafana.png"
        port: 8005
        targetPort: 3000
