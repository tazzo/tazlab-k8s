apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  releaseName: kube-prometheus-stack
  interval: 1h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "61.3.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: grafana-dynamic-creds
      valuesKey: username
      targetPath: grafana.podAnnotations.vault-dynamic-username
  values:

    alertmanager:
      enabled: false
    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true
    prometheus:
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: tazlab-storage
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    grafana:
      enabled: true
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      serviceAccount:
        create: false
        name: grafana-sa
      containerSecurityContext:
        runAsUser: 472
        runAsGroup: 472
      database:
        type: sqlite3
      assertNoLeakedSecrets: false
      grafana.ini:
        server:
          domain: grafana.tazlab.net
          root_url: https://grafana.tazlab.net/
          serve_from_sub_path: false
        auth.proxy:
          enabled: true
          header_name: X-Auth-Request-Email
          header_property: email
          header_email: X-Auth-Request-Email
          auto_sign_up: true
          sync_ttl: 0
          sync_ttl_api_key: 0
          enable_login_token_rotation: false
          skip_org_role_sync: true
          disable_login_form: true
        security:
          admin_user: ''
          allow_login_without_configured_admin: true
        database:
          type: postgres
          host: tazlab-db-primary.tazlab-db.svc:5432
          name: grafana
          user: grafana
          ssl_mode: require
          ca_cert_path: /etc/grafana/certs/ca.crt
          client_cert_path: /etc/grafana/certs/tls.crt
          client_key_path: /etc/grafana/certs/tls.key
      extraSecretMounts:
        - name: grafana-db-certs
          secretName: db-client-grafana-tls
          mountPath: /tmp/db-certs-in
          readOnly: true
          defaultMode: 384
      extraInitContainers:
        - name: copy-db-certs
          image: alpine:3.21
          command:
            - sh
            - -c
            - |
              cp -rL /tmp/db-certs-in/* /etc/grafana/certs/
              chmod 600 /etc/grafana/certs/tls.key
              ls -la /etc/grafana/certs/
          volumeMounts:
            - name: grafana-db-certs
              mountPath: /tmp/db-certs-in
            - name: grafana-certs-empty
              mountPath: /etc/grafana/certs
      extraVolumes:
        - name: grafana-certs-empty
          emptyDir: {}
      extraVolumeMounts:
        - name: grafana-certs-empty
          mountPath: /etc/grafana/certs
      podAnnotations:
        rollout-trigger: "2026-06-01-v2"
      persistence:
        enabled: false
      service:
        type: LoadBalancer
        annotations:
          metallb.universe.tf/loadBalancerIPs: "192.168.1.240"
          metallb.universe.tf/allow-shared-ip: "tazlab-internal-dashboard"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Grafana"
          gethomepage.dev/group: "Management"
          gethomepage.dev/icon: "grafana.png"
        port: 8005
        targetPort: 3000
