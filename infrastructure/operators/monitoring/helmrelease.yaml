apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  releaseName: kube-prometheus-stack
  interval: 1h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "61.3.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    # Minimal Setup to avoid timeouts
    alertmanager:
      enabled: false
    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true
    
    # Prometheus Configuration
    prometheus:
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: tazlab-storage
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    
    # Grafana Configuration (PostgreSQL Backend via Vault Agent Injector)
    grafana:
      enabled: true
      serviceAccount:
        create: false
        name: grafana-sa
      podAnnotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "grafana-consumer"
        vault.hashicorp.com/auth-type: "jwt"
        vault.hashicorp.com/auth-path: "auth/jwt"
        vault.hashicorp.com/auth-config-path: "/var/run/secrets/kubernetes.io/serviceaccount/token"
        vault.hashicorp.com/auth-config-remove-jwt-after-reading: "false"
        vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"
        vault.hashicorp.com/tls-secret: "vault-ca-cert"
        vault.hashicorp.com/agent-inject-secret-db-creds-username: "database/creds/grafana"
        vault.hashicorp.com/agent-inject-template-db-creds-username: |
          {{ "{{" }}- with secret "database/creds/grafana" -{{ "}}" }}
          {{ "{{" }} .Data.username {{ "}}" }}
          {{ "{{" }}- end {{ "}}" }}
        vault.hashicorp.com/agent-inject-secret-db-creds-password: "database/creds/grafana"
        vault.hashicorp.com/agent-inject-template-db-creds-password: |
          {{ "{{" }}- with secret "database/creds/grafana" -{{ "}}" }}
          {{ "{{" }} .Data.password {{ "}}" }}
          {{ "{{" }}- end {{ "}}" }}
        vault.hashicorp.com/agent-inject-command-db-creds-username: "kill -TERM 1"
        vault.hashicorp.com/agent-share-process-namespace: "true"
        vault.hashicorp.com/agent-run-as-same-user: "true"
      extraInitContainers:
        - name: wait-for-db
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting Database Waiter..."
              until nc -zv tazlab-db-primary.tazlab-db.svc.cluster.local 5432; do
                echo "Waiting for database at tazlab-db-primary:5432..."
                sleep 5
              done
              echo "Database is UP! Proceeding..."
      grafana.ini:
        server:
          domain: grafana.tazlab.net
          root_url: https://grafana.tazlab.net/
          serve_from_sub_path: false
        database:
          type: postgres
          host: tazlab-db-primary.tazlab-db.svc.cluster.local:5432
          name: grafana
          user: ''
          sslmode: disable
        auth.proxy:
          enabled: true
          header_name: X-Auth-Request-Email
          header_property: email
          header_email: X-Auth-Request-Email
          auto_sign_up: true
          sync_ttl: 0
          sync_ttl_api_key: 0
          enable_login_token_rotation: false
          skip_org_role_sync: true
          disable_login_form: true
        security:
          admin_user: ''
          allow_login_without_configured_admin: true
      env:
        GF_DATABASE_USER__FILE: /vault/secrets/db-creds-username
        GF_DATABASE_PASSWORD__FILE: /vault/secrets/db-creds-password
      
      persistence:
        enabled: false
      service:
        type: LoadBalancer
        annotations:
          metallb.universe.tf/loadBalancerIPs: "192.168.1.240"
          metallb.universe.tf/allow-shared-ip: "tazlab-internal-dashboard"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Grafana"
          gethomepage.dev/group: "Management"
          gethomepage.dev/icon: "grafana.png"
        port: 8005
        targetPort: 3000
