apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tazlab-db-pguser-grafana
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tazlab-secrets
    kind: ClusterSecretStore
  target:
    name: tazlab-db-pguser-grafana
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: GRAFANA_DB_PASSWORD
    - secretKey: user
      remoteRef:
        key: GRAFANA_DB_USER
