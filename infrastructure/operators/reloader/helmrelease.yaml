apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  releaseName: reloader
  targetNamespace: reloader
  chart:
    spec:
      chart: reloader
      version: "1.2.1"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      watchGlobally: true
