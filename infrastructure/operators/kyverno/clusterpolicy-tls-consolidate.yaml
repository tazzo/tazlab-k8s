apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: consolidate-wildcard-tls
  annotations:
    policies.kyverno.io/title: Consolidate Wildcard TLS Certificate
    policies.kyverno.io/description: >-
      Monitors wildcard-crt and wildcard-key secrets in vso-system,
      consolidates them into a unified kubernetes.io/tls secret,
      and appends Reflector auto-mirror annotations for distribution
      to auth, dex, hugo-blog, hugo-wiki, and ai-agents namespaces.
spec:
  rules:
    - name: merge-tls-and-reflect
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - vso-system
              names:
                - wildcard-crt
                - wildcard-key
      context:
        - name: crtData
          apiCall:
            urlPath: /api/v1/namespaces/vso-system/secrets/wildcard-crt
            jmesPath: data
            default: {}
        - name: keyData
          apiCall:
            urlPath: /api/v1/namespaces/vso-system/secrets/wildcard-key
            jmesPath: data
            default: {}
      preconditions:
        all:
          - key: "{{ crtData.'tls.crt' || '' }}"
            operator: NotEquals
            value: ""
          - key: "{{ keyData.'tls.key' || '' }}"
            operator: NotEquals
            value: ""
      generate:
        apiVersion: v1
        kind: Secret
        name: wildcard-tls
        namespace: vso-system
        synchronize: true
        data:
          type: kubernetes.io/tls
          metadata:
            annotations:
              reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
              reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "auth,dex,hugo-blog,hugo-wiki,ai-agents"
              reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
              reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "auth,dex,hugo-blog,hugo-wiki,ai-agents"
          data:
            tls.crt: "{{ crtData.'tls.crt' }}"
            tls.key: "{{ keyData.'tls.key' }}"
