apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-dag-watchdog-script
  namespace: flux-system
data:
  watchdog.sh: |
    #!/usr/bin/env bash
    # flux-dag-watchdog — unstick the Flux dependency DAG.
    #
    # Root cause this exists for: a Kustomization is gated by `spec.dependsOn`, but Flux
    # does not re-queue a dependent when its dependency transitions to Ready if that
    # event is missed (e.g. the dependency was already Ready when the dependent was
    # evaluated, or the controller restarted meanwhile). The dependent then waits for its
    # own `interval`. With chained dependencies that stalls the whole DAG for hours — the
    # more so the longer the interval — and NO reconciliation is actually failing.
    #
    # This watchdog detects exactly that state — not Ready while every dependency IS
    # Ready — and forces an immediate reconcile via the reconcile-request annotation.
    # It only nudges objects already described in Git; nothing is created, deleted or
    # changed beyond that annotation. Multiple passes per run clear several DAG levels
    # in one go.
    set -euo pipefail

    NS="${NAMESPACE:-flux-system}"
    DRY_RUN="${DRY_RUN:-false}"
    PASSES="${PASSES:-3}"
    PASS_SLEEP="${PASS_SLEEP:-30}"
    log() { printf '[flux-dag-watchdog] %s %s\n' "$(date -u +%FT%TZ)" "$*"; }

    detect() {
      # NOTE: plain pipes only — bash here-strings/heredocs need temp files and the
      # container runs with a read-only root filesystem.
      kubectl -n "$NS" get kustomizations.kustomize.toolkit.fluxcd.io -o json |
        jq -r '
          ( [ .items[]
              | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
              | .metadata.name
            ] | map({ (.): true }) | add // {} ) as $ready
          | .items[]
          | select( ( any(.status.conditions[]?; .type == "Ready" and .status == "True") ) | not )
          | select( [ .spec.dependsOn[]?.name ] | map($ready[.] // false) | all )
          | "\(.metadata.name)\t\((.status.conditions[]? | select(.type == "Ready") | .reason) // "Unknown")"
        '
    }

    for pass in $(seq 1 "$PASSES"); do
      stalled=$(detect)
      if [ -z "$stalled" ]; then
        log "pass $pass/$PASSES — no stalled Kustomizations, DAG healthy"
        exit 0
      fi
      log "pass $pass/$PASSES — stalled: $(printf '%s' "$stalled" | tr '\n' ' ')"
      printf '%s\n' "$stalled" | while IFS=$'\t' read -r name reason; do
        [ -n "$name" ] || continue
        if [ "$DRY_RUN" = "true" ]; then
          log "DRY-RUN would reconcile $name (reason: $reason)"
          continue
        fi
        log "forcing reconcile of $name (reason: $reason)"
        kubectl -n "$NS" annotate kustomization "$name" --overwrite \
          "reconcile.fluxcd.io/requestedAt=$(date -u +%FT%TZ)" >/dev/null
      done
      if [ "$pass" -lt "$PASSES" ]; then
        sleep "$PASS_SLEEP"
      fi
    done
