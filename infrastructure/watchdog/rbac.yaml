apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-dag-watchdog
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-dag-watchdog
  namespace: flux-system
rules:
  # Read the DAG state and nudge stalled Kustomizations.
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-dag-watchdog
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-dag-watchdog
subjects:
  - kind: ServiceAccount
    name: flux-dag-watchdog
    namespace: flux-system
