apiVersion: batch/v1
kind: CronJob
metadata:
  name: flux-dag-watchdog
  namespace: flux-system
  labels:
    app.kubernetes.io/name: flux-dag-watchdog
    app.kubernetes.io/part-of: flux
spec:
  # Every two minutes, with three internal passes: a frozen DAG (which is a chain of
  # missed dependency events) is fully re-converged within a couple of runs, and the
  # worst-case stall for any object is bounded by this schedule.
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flux-dag-watchdog
        spec:
          serviceAccountName: flux-dag-watchdog
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              image: alpine/k8s:1.31.0
              command: ["/usr/bin/env", "bash", "/scripts/watchdog.sh"]
              env:
                - name: NAMESPACE
                  value: flux-system
                - name: DRY_RUN
                  value: "false"
                - name: PASSES
                  value: "3"
                - name: PASS_SLEEP
                  value: "30"
                - name: HOME
                  value: /tmp
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: flux-dag-watchdog-script
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
