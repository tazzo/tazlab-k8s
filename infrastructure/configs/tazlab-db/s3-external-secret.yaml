apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: s3-backrest-creds
  namespace: tazlab-db
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tazlab-secrets-vault
  target:
    name: s3-backrest-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # File di config che CrunchyData monta nel pod di restore
        s3.conf: |
          [global]
          repo1-s3-key={{ .AWS_ACCESS_KEY_ID }}
          repo1-s3-key-secret={{ .AWS_SECRET_ACCESS_KEY }}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: tazlab-k8s/static/storage/tazlab-db/AWS_ACCESS_KEY_ID
        property: value
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: tazlab-k8s/static/storage/tazlab-db/AWS_SECRET_ACCESS_KEY
        property: value
