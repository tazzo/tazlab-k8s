apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tazlab-db-pguser-grafana
  namespace: tazlab-db
  labels:
    postgres-operator.crunchydata.com/cluster: tazlab-db
    postgres-operator.crunchydata.com/pguser: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tazlab-secrets
    kind: ClusterSecretStore
  target:
    name: tazlab-db-pguser-grafana
    creationPolicy: Orphan
  data:
    - secretKey: password
      remoteRef:
        key: GRAFANA_DB_PASSWORD
    - secretKey: user
      remoteRef:
        key: GRAFANA_DB_USER
    - secretKey: dbname
      remoteRef:
        key: GRAFANA_DB_NAME
    - secretKey: host
      remoteRef:
        key: GRAFANA_DB_HOST
