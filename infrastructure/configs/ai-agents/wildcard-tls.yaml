apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wildcard-tls-v2
  namespace: ai-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tazlab-secrets
  target:
    name: wildcard-tls
    template:
      type: kubernetes.io/tls
      engineVersion: v2
  dataFrom:
  - find:
      name:
        regexp: WILDCARD_.*
