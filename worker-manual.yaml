version: v1alpha1
debug: false
persist: true
machine:
  type: worker
  token: j8e0ti.cnaqgod2orrtfot0
  ca:
    crt: 
  install:
    disk: /dev/sda
    image: ghcr.io/siderolabs/installer:v1.12.0
    wipe: false
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.35.0
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
  network:
    hostname: worker-new-01
  disks:
    - device: /dev/sdb
      partitions:
        - mountpoint: /var/mnt/longhorn
  kernel:
    modules:
      - name: iscsi_tcp
      - name: nbd
      - name: iscsi_generic
      - name: configfs
  features:
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
