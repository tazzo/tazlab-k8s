apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hugo-blog-pvc
  namespace: hugo-blog
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugo-blog
  namespace: hugo-blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hugo-blog
  template:
    metadata:
      labels:
        app: hugo-blog
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000 # Forziamo l'utente 1000 per tutto il pod
      containers:
        # Container 1: Hugo Server
        - name: hugo
          image: hugomods/hugo:exts-non-root
          args:
            - server
            - --bind=0.0.0.0
            - --buildDrafts
            - --buildFuture
            - --watch
            - --baseURL=https://blog.tazlab.net/
            - --appendPort=false
            - --source=/src/current
          ports:
            - containerPort: 1313
          volumeMounts:
            - name: blog-src
              mountPath: /src
        
        # Container 2: Git-Sync Sidecar
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.3
          args:
            - --repo=https://github.com/tazzo/blog.tazlab.net.git
            - --ref=master
            - --period=60s
            - --root=/src
            - --link=current
            - --add-user
            - --username=tazzo
            - --password-file=/etc/git-secret/token
            - --group-write # Permette al gruppo (1000) di scrivere
          volumeMounts:
            - name: blog-src
              mountPath: /src
            - name: git-secret
              mountPath: /etc/git-secret
              readOnly: true
      volumes:
        - name: blog-src
          persistentVolumeClaim:
            claimName: hugo-blog-pvc
        - name: git-secret
          secret:
            secretName: github-token
---
apiVersion: v1
kind: Service
metadata:
  name: hugo-blog
  namespace: hugo-blog
spec:
  ports:
    - port: 80
      targetPort: 1313
  selector:
    app: hugo-blog
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hugo-blog-ingress
  namespace: hugo-blog
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: myresolver
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - blog.tazlab.net
  rules:
    - host: blog.tazlab.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hugo-blog
                port:
                  number: 80
