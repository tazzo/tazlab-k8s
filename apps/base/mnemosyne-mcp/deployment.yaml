apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnemosyne-mcp
  namespace: tazlab-db
  annotations:
    secret.reloader.stakater.com/reload: "tazlab-db-pguser-mnemosyne,mnemosyne-mcp-secrets"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mnemosyne-mcp
  template:
    metadata:
      labels:
        app: mnemosyne-mcp
    spec:
      serviceAccountName: mnemosyne-mcp-sa
      containers:
        - name: server
          image: tazzo/mnemosyne-mcp:mcp-29-ace89cfbfa8e79b523ff01c0dfe38ffcff336d18 # {"$imagepolicy": "flux-system:mnemosyne-mcp"}
          imagePullPolicy: Always
          env:
            - name: MCP_TRANSPORT
              value: "sse"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tazlab-db-pguser-mnemosyne
                  key: host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: tazlab-db-pguser-mnemosyne
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tazlab-db-pguser-mnemosyne
                  key: user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: tazlab-db-pguser-mnemosyne
                  key: password
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mnemosyne-mcp-secrets
                  key: GEMINI_API_KEY
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
