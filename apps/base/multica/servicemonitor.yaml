apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: multica-backend
  namespace: multica
  labels:
    # kube-prometheus-stack selects ServiceMonitors by this label in every
    # namespace (serviceMonitorNamespaceSelector is empty).
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: multica
      app.kubernetes.io/instance: multica
      app.kubernetes.io/component: backend
  namespaceSelector:
    matchNames: [multica]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
