apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambrogio-site
  namespace: ambrogio-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ambrogio-site
  template:
    metadata:
      labels:
        app: ambrogio-site
        app.kubernetes.io/name: ambrogio-site
    spec:
      containers:
        - name: web
          # The ImageUpdateAutomation pins this to the highest ambrogio-site-<N>-<sha>
          # tag; until the first image is published, :latest is what the workflow pushes.
          image: tazzo/tazlab-ambrogio-site:ambrogio-site-5-b59008143c663e4f3c2f61782d0e00a8e77e08db # {"$imagepolicy": "flux-system:ambrogio-site"}
          ports:
            - containerPort: 80
          # PROGETTO §5.3: the shape is teaching.yaml:62-72 with the path changed to `/`,
          # and no startupProbe — nginx is ready in well under a second.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
            failureThreshold: 5
          # PROGETTO §5.4: requests are not optional (buzz/helmrelease.yaml:141-142 — a pod
          # with no request is an unranked eviction candidate); the numbers are below the
          # lab's smallest services, because nginx serving five files holds a few MB.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ambrogio-site
  namespace: ambrogio-site
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: ambrogio-site
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ambrogio-site-ingress
  namespace: ambrogio-site
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Ambrogio"
    gethomepage.dev/group: "Developer"
    gethomepage.dev/icon: "mdi-robot"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ambrogio.tazlab.net
      secretName: ambrogio-tazlab.net-tls
  rules:
    - host: ambrogio.tazlab.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ambrogio-site
                port:
                  number: 80
