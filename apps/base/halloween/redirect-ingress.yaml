# Cleartext HTTP is redirected here. This router is deliberately separate from the
# TLS router: the HTTPS-only router answers 404 on http://, so a redirect middleware
# attached to it would be a no-op. router.priority is pinned low so the cert-manager
# HTTP-01 solver router (a longer, more specific rule) always wins.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: halloween-redirect-ingress
  namespace: halloween
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: halloween-halloween-redirect-to-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  rules:
    - host: halloween.tazlab.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: halloween
                port:
                  number: 80
