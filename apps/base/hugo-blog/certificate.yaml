apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: blog-tazlab.net-tls
  namespace: hugo-blog
spec:
  secretName: blog-tazlab.net-tls
  issuerRef:
    name: tazlab-issuer
    kind: ClusterIssuer
  commonName: tazlab.net
  dnsNames:
    - tazlab.net
    - "*.tazlab.net"
  privateKey:
    rotationPolicy: Always
    algorithm: RSA
    size: 2048