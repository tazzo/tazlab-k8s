apiVersion: v1
kind: Namespace
metadata:
  name: hugo-blog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugo-blog
  namespace: hugo-blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hugo-blog
  template:
    metadata:
      labels:
        app: hugo-blog
    spec:
      containers:
        - name: blog
          image: tazzo/tazlab.net:blog-0fef4e5 # {"$imagepolicy": "flux-system:hugo-blog"}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hugo-blog
  namespace: hugo-blog
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: hugo-blog
---
# MAIN INGRESS (No redirect)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hugo-blog-ingress
  namespace: hugo-blog
  annotations:
    # Usiamo il wildcard di Infisical, non serve Cert-Manager qui
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - blog.${domain}
      secretName: blog-${domain}-tls
  rules:
    - host: blog.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hugo-blog
                port:
                  number: 80
---
# REDIRECT INGRESS (With middleware)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hugo-blog-redirect-ingress
  namespace: hugo-blog
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: hugo-blog-hugo-blog-redirect-to-blog@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${domain}
        - www.${domain}
        - lab.${domain}
      # Uniformiamo tutto sul wildcard di Infisical
      secretName: blog-${domain}-tls
  rules:
    - host: lab.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hugo-blog
                port:
                  number: 80
    - host: ${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hugo-blog
                port:
                  number: 80
    - host: www.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hugo-blog
                port:
                  number: 80
