apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight-dashboard
  namespace: hindsight
  labels:
    app: hindsight-dashboard
    app.kubernetes.io/name: hindsight-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hindsight-dashboard
  template:
    metadata:
      labels:
        app: hindsight-dashboard
        app.kubernetes.io/name: hindsight-dashboard
    spec:
      serviceAccountName: hindsight-sa
      enableServiceLinks: false
      containers:
        - name: hindsight-dashboard
          image: ghcr.io/vectorize-io/hindsight-control-plane:0.9.2@sha256:d9bf57083f7cb0a53ee5011bdfde6aae2490dbf5c360d2d1bff10473b45eb112
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9999
              name: http
          env:
            # NOTE: the control-plane image binds 9999 (its built-in default) and
            # ignores PORT — verified live 2026-08-28 (review V5/m4)
            - name: PORT
              value: "9999"
            - name: HINDSIGHT_CP_DATAPLANE_API_URL
              value: http://hindsight-api.hindsight.svc.cluster.local:8888
            - name: HINDSIGHT_CP_DATAPLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-cp-key
                  key: value
            - name: HINDSIGHT_CP_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-cp-key
                  key: value
          livenessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
