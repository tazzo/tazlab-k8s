apiVersion: v1
kind: ServiceAccount
metadata:
  name: hindsight-sa
  namespace: hindsight
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-secret-reader
  namespace: hindsight
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-secret-reader
  namespace: hindsight
subjects:
  - kind: ServiceAccount
    name: hindsight-sa
    namespace: hindsight
roleRef:
  kind: Role
  name: hindsight-secret-reader
  apiGroup: rbac.authorization.k8s.io
