apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight-api
  namespace: hindsight
  labels:
    app: hindsight-api
    app.kubernetes.io/name: hindsight-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hindsight-api
  template:
    metadata:
      labels:
        app: hindsight-api
        app.kubernetes.io/name: hindsight-api
    spec:
      serviceAccountName: hindsight-sa
      enableServiceLinks: false
      securityContext:
        # hindsight image runs as uid/gid 1000 (non-root); fsGroup lets the
        # kubelet chgrp the mounted secrets so uid 1000 can read them
        fsGroup: 1000
      initContainers:
        - name: quota-gate
          image: alpine:3.20@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e
          command: ["sh", "-c", "-e"]
          env:
            - name: GEMINI_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-gemini-key
                  key: value
          args:
            - |
              echo "[quota-gate] waiting for embedding quota window..."
              sleep 10
              for i in $(seq 1 30); do
                RESP=$(wget -qO- --timeout=15 --post-data='{"model":"models/gemini-embedding-001","content":{"parts":[{"text":"gate"}]}}' \
                  "https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent?key=${GEMINI_KEY}" 2>/dev/null || true)
                if echo "$RESP" | grep -q '"embedding"'; then
                  echo "[quota-gate] quota OK (try $i)"
                  exit 0
                fi
                echo "[quota-gate] not yet (try $i) — backing off"
                sleep 20
              done
              echo "[quota-gate] quota never opened in window — failing"
              exit 1
        - name: ensure-db
          image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          command: ["sh", "-c", "-e"]
          env:
            - name: PGHOST
              value: tazlab-db-primary.tazlab-db.svc
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: hindsight
            - name: PGUSER
              value: hindsight
            - name: PGSSLCERT
              value: /etc/certs/tls.crt
            - name: PGSSLKEY
              value: /etc/certs/tls.key
            - name: PGSSLROOTCERT
              value: /etc/certs/ca.crt
            - name: PGSSLMODE
              value: verify-full
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/certs
              readOnly: true
          args:
            - |
              # Wait for DB (PG up + user/db reconciled), then VERIFY the vector
              # extension exists. The extension itself is created by the
              # hindsight-db-extensions Job (Crunchy pgvector is not trusted).
              until psql -t -c "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for hindsight database..."
                sleep 5
              done
              if ! psql -t -c "SELECT 1 FROM pg_extension WHERE extname = 'vector'" | grep -q 1; then
                echo "FATAL: vector extension missing in db hindsight"
                exit 1
              fi
              echo "DB ready: mTLS ok, vector extension present"
      containers:
        - name: hindsight-api
          image: ghcr.io/vectorize-io/hindsight-api:0.9.2-slim@sha256:7635a15739361dbdf221ba796ad25a813f876144fe113022eea8e26cb6ee75e7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
              name: http
          env:
            # B3: kubelet injects HINDSIGHT_API_PORT from the Service named
            # hindsight-api — must be overridden explicitly (upstream chart does the same)
            - name: HINDSIGHT_API_PORT
              value: "8888"
            - name: HINDSIGHT_API_DATABASE_URL
              value: "postgresql://hindsight@tazlab-db-primary.tazlab-db.svc:5432/hindsight?sslmode=verify-full&sslcert=/etc/certs/tls.crt&sslkey=/etc/certs/tls.key&sslrootcert=/etc/certs/ca.crt"
            - name: HINDSIGHT_API_DATABASE_SCHEMA
              value: hindsight
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: opencode-go
            - name: HINDSIGHT_API_LLM_MODEL
              value: mimo-v2.5
            - name: HINDSIGHT_API_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-opencode-key
                  key: value
            - name: HINDSIGHT_API_LLM_STRICT_SCHEMA
              value: "true"
            - name: HINDSIGHT_API_LLM_REASONING_EFFORT
              value: none
            - name: HINDSIGHT_API_EMBEDDINGS_PROVIDER
              value: google
            - name: HINDSIGHT_API_EMBEDDINGS_GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-gemini-key
                  key: value
            - name: HINDSIGHT_API_EMBEDDINGS_GEMINI_MODEL
              value: gemini-embedding-001
            - name: HINDSIGHT_API_EMBEDDINGS_GEMINI_OUTPUT_DIMENSIONALITY
              value: "768"
            - name: HINDSIGHT_API_RERANKER_PROVIDER
              value: rrf
            - name: HINDSIGHT_API_MCP_ENABLED
              value: "true"
            - name: HINDSIGHT_API_MCP_STATELESS
              value: "true"
            - name: HINDSIGHT_API_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hindsight-mcp-token
                  key: value
            - name: HINDSIGHT_API_METRICS_BACKLOG_ENABLED
              value: "true"
            - name: HINDSIGHT_API_FILE_STORAGE_TYPE
              value: native
            - name: HINDSIGHT_API_FILE_DELETE_AFTER_RETAIN
              value: "true"
            - name: HINDSIGHT_API_WORKER_ENABLED
              value: "false"
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: tls-certs
          secret:
            secretName: db-client-hindsight-tls
            defaultMode: 416
