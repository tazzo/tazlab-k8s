apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hindsight-api
  namespace: hindsight
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: hindsight-api
  namespaceSelector:
    matchNames: [hindsight]
  endpoints:
    - port: api-mcp
      path: /metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hindsight-worker
  namespace: hindsight
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: hindsight-worker
  namespaceSelector:
    matchNames: [hindsight]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
