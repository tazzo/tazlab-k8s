apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wiki-tazlab.net-tls
  namespace: hugo-wiki
spec:
  secretName: wiki-tazlab.net-tls
  issuerRef:
    name: letsencrypt-issuer
    kind: ClusterIssuer
  commonName: wiki.tazlab.net
  dnsNames:
    - wiki.tazlab.net
  privateKey:
    rotationPolicy: Always
    algorithm: RSA
    size: 2048
