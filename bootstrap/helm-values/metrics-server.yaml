# Configurazione Metrics Server per Talos

args:
  - --kubelet-insecure-tls

# Tolleranze per permettere al Metrics Server di girare ovunque (incluso Control Plane)
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
