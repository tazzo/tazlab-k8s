# Target Version: 1.10.1
defaultSettings:
  defaultDataPath: /var/lib/longhorn
  defaultReplicaCount: 3
  taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule;node-role.kubernetes.io/master:NoSchedule"
  backupTarget: "s3://tazlab-longhorn@eu-central-1/"
  backupTargetCredentialSecret: "aws-backup-secret"

longhornManager:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

longhornDriver:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

longhornUI:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

persistence:
  defaultClassReplicaCount: 3

ingress:
  enabled: true
  host: longhorn.tazlab.net
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: myresolver
  tls:
    - hosts:
      - longhorn.tazlab.net
      secretName: longhorn-tazlab-net-tls
